name: QA distributor card width and AAA — V8

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install real Chromium Firefox and WebKit
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium firefox webkit >/dev/null
      - name: Serve actual candidate
        run: |
          python3 -m http.server 4173 >/tmp/popnwash-distributor.log 2>&1 &
          sleep 2
      - name: Check every product label in 11 locales and 80-200% AAA
        run: node qa/distributor-container-v8.mjs
      - name: Attach screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-distributor-card-v8
          path: qa-distributor/
          retention-days: 14
