name: QA manual review bundle
on:
  push:
    branches: ["feat/display-size-80-150-responsive"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact site snapshots for offline browser inspection
        run: |
          mkdir -p review-bundle/candidate review-bundle/baseline
          cp index.html app.js display-scale.css display-scale.js mobile-landing.css review-bundle/candidate/
          cp -r assets review-bundle/candidate/assets
          git archive origin/main index.html app.js assets | tar -x -C review-bundle/baseline
          printf 'candidate=%s\nbaseline=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse origin/main)" > review-bundle/commits.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manual-review-site-snapshots
          path: review-bundle/
          retention-days: 7
