name: QA native macOS Safari smoke test (separate from WebKit)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Configure native Safari WebDriver
        run: |
          /usr/bin/safaridriver --version || true
          sudo /usr/bin/safaridriver --enable
          python3 -m venv .safari-venv
          .safari-venv/bin/pip install selenium >/dev/null
      - name: Start local website
        run: |
          python3 -m http.server 4173 >/tmp/popnwash-native-safari.log 2>&1 &
          sleep 2
      - name: Verify genuine Safari desktop resizing and theme buttons
        run: |
          mkdir -p native-safari-evidence
          cat > qa_safari.py <<'PY'
          import json,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.safari.options import Options
          results={'engine':'native Safari on macOS','cases':[],'failures':[]}
          driver=webdriver.Safari(options=Options())
          try:
            driver.get('http://127.0.0.1:4173/')
            for width,height in [(1024,768),(1280,800),(1440,900),(1920,1080)]:
              driver.set_window_size(width,height)
              time.sleep(.3)
              for scale in [80,110,150]:
                r=driver.execute_script("""
                  document.querySelector('[data-lang="fr"]').click();
                  document.querySelector('[data-display-size="'+arguments[0]+'"]').click();
                  document.querySelector('[data-theme-choice="dark"]').click();
                  const root=document.documentElement;
                  const a=document.querySelector('.brand-title').getBoundingClientRect();
                  const b=document.getElementById('displaySizeButton').getBoundingClientRect();
                  const shell=document.querySelector('.theme-slider-shell').getBoundingClientRect();
                  const knob=document.querySelector('.theme-knob').getBoundingClientRect();
                  return {width:innerWidth,scale:root.dataset.displayScale,
                    dark:root.dataset.theme==='dark', overflow:root.scrollWidth-innerWidth,
                    brandOverlap:a.right>b.left,knobRight:(knob.left+knob.right)>(shell.left+shell.right)};
                """,scale)
                if r['scale']!=str(scale) or not r['dark'] or r['overflow']>2 or r['brandOverlap'] or not r['knobRight']:
                  results['failures'].append({'size':scale,'requestedWidth':width,'result':r})
                results['cases'].append({'requestedWidth':width,'height':height,'scale':scale,'result':r})
              driver.save_screenshot('native-safari-evidence/safari-'+str(width)+'.png')
          finally:
            driver.quit()
          Path('native-safari-evidence/report.json').write_text(json.dumps(results,indent=2))
          print(json.dumps({'total':len(results['cases']),'failures':results['failures'][:15]},indent=2))
          if results['failures']:raise SystemExit(1)
          PY
          .safari-venv/bin/python qa_safari.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genuine-macos-safari-test
          path: native-safari-evidence/
          retention-days: 14
