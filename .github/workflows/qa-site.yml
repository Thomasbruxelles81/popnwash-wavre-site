name: QA responsive POP'n WASH

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Serve site
        run: |
          python3 -m http.server 4173 >/tmp/popnwash-http.log 2>&1 &
          echo $! > /tmp/popnwash-http.pid
          sleep 2

      - name: Run full responsive QA
        run: |
          mkdir -p qa-screenshots
          cat > qa.mjs <<'EOF'
          import { chromium, firefox, webkit } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const cases = [
            ['phone-small-320',320,568],
            ['phone-portrait-360',360,800],
            ['phone-portrait-390',390,844],
            ['phone-large-430',430,932],
            ['phone-landscape',844,390],
            ['phone-landscape-large',915,412],
            ['tablet-portrait',768,1024],
            ['tablet-portrait-large',820,1180],
            ['tablet-landscape',1024,768],
            ['compact-laptop',1280,800],
            ['laptop',1366,768],
            ['desktop',1920,1080],
          ];
          const failures=[];
          for (const [name,width,height] of cases) {
            const page = await browser.newPage({viewport:{width,height}});
            await page.addInitScript(() => localStorage.setItem('popnwash-lang','fr'));
            const consoleErrors=[];
            page.on('pageerror', e => consoleErrors.push('pageerror: '+e.message));
            page.on('console', m => { if(m.type()==='error') consoleErrors.push('console: '+m.text()); });
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle', timeout:45000});
            await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
            await page.waitForTimeout(300);
            await page.evaluate(() => window.scrollTo(0,0));
            const overflow = await page.evaluate(() => ({
              sw: document.documentElement.scrollWidth,
              cw: document.documentElement.clientWidth
            }));
            if (overflow.sw > overflow.cw + 2) failures.push(`${name}: horizontal overflow ${overflow.sw}>${overflow.cw}`);
            const weebly = await page.locator('img[src*="weebly.com"]').count();
            if(weebly) failures.push(`${name}: Weebly dependency still present`);
            const localBroken = await page.locator('img').evaluateAll(async imgs => {
              for (const img of imgs) {
                img.loading='eager';
                img.scrollIntoView({block:'center'});
                if (!img.complete) await new Promise(resolve => {
                  const done=()=>resolve();
                  img.addEventListener('load',done,{once:true});
                  img.addEventListener('error',done,{once:true});
                  setTimeout(done,2500);
                });
              }
              return imgs.filter(i => !i.complete || i.naturalWidth===0).map(i => i.getAttribute('src'));
            });
            if(localBroken.length) failures.push(`${name}: broken images ${localBroken.join(', ')}`);
            // A cover image is only acceptable when its rendered ratio matches its natural ratio closely.
            // This catches visually cropped photos even when there is no CSS overflow.
            const cropRisks=await page.locator('img').evaluateAll(imgs=>imgs.flatMap(img=>{
              if(!img.complete||!img.naturalWidth||!img.naturalHeight)return [];
              const cs=getComputedStyle(img),r=img.getBoundingClientRect();
              if(r.width<2||r.height<2||cs.display==='none'||cs.visibility==='hidden')return [];
              if(cs.objectFit!=='cover')return [];
              const natural=img.naturalWidth/img.naturalHeight;
              const rendered=r.width/r.height;
              const mismatch=Math.abs(natural-rendered)/natural;
              return mismatch>.045?[((img.getAttribute('src')||'image')+' natural='+natural.toFixed(3)+' rendered='+rendered.toFixed(3))]:[];
            }));
            if(cropRisks.length) failures.push(`${name}: image crop risk ${cropRisks.join(' | ')}`);
            const checks = {
              h1: await page.locator('h1').count(),
              lang: await page.locator('#langButton').count(),
              wi: await page.locator('a[href*="status.wi-line.fr"]').count(),
              phone: await page.locator('a[href="tel:+32486999251"]').count(),
              mail: await page.locator('a[href="mailto:ahb.lavoir@gmail.com"]').count(),
              facebook: await page.locator('a[href*="facebook.com/people/POPn-Wash-Wavre"]').count(),
              instagram: await page.locator('a[href*="instagram.com/popnwashwavre"]').count(),
              services: await page.locator('#services').count(),
              pros: await page.locator('#pros').count(),
              themeSlider: await page.locator('#themeSlider').count(),
              pet7: await page.getByText('7 kg · 4,00 €', {exact:true}).count(),
              pet14: await page.getByText('14 kg · 7,00 €', {exact:true}).count(),
            };
            for(const [k,v] of Object.entries(checks)) if(!v) failures.push(`${name}: missing ${k}`);
            const pageText = await page.locator('body').textContent();
            for (const product of ['Lessive Éco','Lessive Peaux sensibles','Lessive Premium','Assouplissant parfumé','Assouplissant peaux sensibles','Désinfectant','Détachant oxygéné']) {
              if(!pageText.includes(product)) failures.push(`${name}: missing product ${product}`);
            }
            if(!pageText.includes('code valable 24 h') && !pageText.includes('valable 24 h')) failures.push(`${name}: invoice 24h instructions incomplete`);
            const internal = await page.locator('a[href^="#"]').evaluateAll(as => as.map(a=>a.getAttribute('href')));
            for (const href of internal) {
              if(href !== '#' && !(await page.locator(href).count())) failures.push(`${name}: broken anchor ${href}`);
            }
            await page.locator('#langButton').click();
            const langs = await page.locator('#langMenu button[data-lang]').count();
            if(langs !== 11) failures.push(`${name}: expected 11 languages, got ${langs}`);
            const menuBox=await page.locator('#langMenu').boundingBox();
            if(menuBox && (menuBox.x < -1 || menuBox.y < -1 || menuBox.x+menuBox.width > width+1 || menuBox.y+menuBox.height > height+1)){
              failures.push(`${name}: language menu clipped/outside viewport ${JSON.stringify(menuBox)}`);
            }
            await page.locator('#langMenu button[data-lang="ro"]').click();
            if((await page.locator('#langCode').textContent()) !== 'RO') failures.push(`${name}: Romanian switch failed`);
            if(consoleErrors.length) failures.push(`${name}: JS/console errors: ${consoleErrors.join(' | ')}`);

            // Dark-mode responsive pass on every viewport.
            await page.locator('#themeSlider').evaluate(el=>{el.value='1';el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))});
            await page.waitForTimeout(100);
            const darkVisual=await page.evaluate(()=>({
              theme:document.documentElement.dataset.theme,
              bodyBg:getComputedStyle(document.body).backgroundColor,
              headerBg:getComputedStyle(document.querySelector('.site-header')).backgroundColor,
              sw:document.documentElement.scrollWidth,
              cw:document.documentElement.clientWidth,
              lightText:document.querySelector('#themeLightText')?.textContent?.trim(),
              darkText:document.querySelector('#themeDarkText')?.textContent?.trim()
            }));
            if(darkVisual.theme!=='dark') failures.push(`${name}: dark theme did not activate`);
            if(darkVisual.bodyBg==='rgb(247, 240, 223)') failures.push(`${name}: dark body still light`);
            if(darkVisual.headerBg==='rgb(255, 230, 188)') failures.push(`${name}: dark header still beige/light`);
            if(darkVisual.sw > darkVisual.cw + 2) failures.push(`${name}: dark horizontal overflow ${darkVisual.sw}>${darkVisual.cw}`);
            if(!darkVisual.lightText || !darkVisual.darkText) failures.push(`${name}: visible theme labels missing`);
            await page.screenshot({path:`qa-screenshots/${name}-dark.png`, fullPage:true});
            await page.close();
          }
          // Full language audit: every language, current hero, FAQ, form and links.
          {
            const page = await browser.newPage({viewport:{width:1366,height:900}});
            await page.addInitScript(() => localStorage.setItem('popnwash-lang','fr'));
            const consoleErrors=[];
            page.on('pageerror', e => consoleErrors.push('pageerror: '+e.message));
            page.on('console', m => { if(m.type()==='error') consoleErrors.push('console: '+m.text()); });
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle', timeout:45000});
            const languages=['fr','nl','en','de','it','es','pt','ro','pl','uk','ru'];
            const expectedCodes={fr:'FR',nl:'NL',en:'EN',de:'DE',it:'IT',es:'ES',pt:'PT',ro:'RO',pl:'PL',uk:'UA',ru:'RU'};
            const frenchHero="Plus de machines.";
            const frenchFaq="Comment lancer un lave-linge ?";
            const frenchPlaceholder="Expliquez-nous votre demande, votre idée ou ce que vous aimeriez améliorer...";
            for(const lang of languages){
              await page.locator('#langButton').click();
              await page.locator('#langMenu button[data-lang="'+lang+'"]').click();
              await page.waitForTimeout(80);
              const code=(await page.locator('#langCode').textContent())?.trim();
              if(code!==expectedCodes[lang]) failures.push('lang '+lang+': code '+code+' != '+expectedCodes[lang]);
              const hero=(await page.locator('h1').innerText()).trim();
              const faqQ=(await page.locator('[data-faq="washer"] summary span').innerText()).trim();
              const placeholder=await page.locator('[data-i18n-placeholder="messagePlaceholder"]').getAttribute('placeholder');
              const faqCount=await page.locator('[data-faq]').count();
              if(faqCount!==22) failures.push('lang '+lang+': expected 22 FAQ items, got '+faqCount);
              if(lang!=='fr' && hero.includes(frenchHero)) failures.push('lang '+lang+': hero stayed French');
              if(lang!=='fr' && faqQ===frenchFaq) failures.push('lang '+lang+': FAQ stayed French');
              if(lang!=='fr' && placeholder===frenchPlaceholder) failures.push('lang '+lang+': form placeholder stayed French');
              const subjectText=(await page.locator('#contactSubject option').first().textContent())?.trim();
              if(lang!=='fr' && subjectText==='Choisir un sujet') failures.push('lang '+lang+': subject option stayed French');
              const lightThemeText=(await page.locator('#themeLightText').textContent())?.trim();
              const darkThemeText=(await page.locator('#themeDarkText').textContent())?.trim();
              if(!lightThemeText || !darkThemeText) failures.push('lang '+lang+': theme labels missing');
              const activeLang=await page.locator('#langMenu button[data-lang="'+lang+'"]').getAttribute('aria-current');
              if(activeLang!=='true') failures.push('lang '+lang+': active language state missing');
              const badFaqLinks=await page.locator('[data-faq] a').evaluateAll(as=>as.filter(a=>{
                const h=a.getAttribute('href')||'';
                return !(h==='#contact'||h.startsWith('https://status.wi-line.fr/')||h.startsWith('https://www.google.com/maps/'));
              }).map(a=>a.getAttribute('href')));
              if(badFaqLinks.length) failures.push('lang '+lang+': bad FAQ links '+badFaqLinks.join(','));
              const internal=await page.locator('a[href^="#"]').evaluateAll(as=>[...new Set(as.map(a=>a.getAttribute('href')).filter(Boolean))]);
              for(const href of internal){
                if(href!=='#' && !(await page.locator(href).count())) failures.push('lang '+lang+': broken anchor '+href);
              }
            }
            if(consoleErrors.length) failures.push('language audit JS errors: '+consoleErrors.join(' | '));
            await page.close();
          }

          await browser.close();

          // Cross-browser theme audit: system preference on first visit, then explicit light/dark user choice.
          for (const [engineName,engine] of [['chromium',chromium],['firefox',firefox],['webkit',webkit]]) {
            const b = await engine.launch({headless:true});
            for (const systemScheme of ['light','dark']) {
              // First visit: no saved theme => follow operating-system preference.
              {
                const p = await b.newPage({viewport:{width:1366,height:900},colorScheme:systemScheme});
                await p.addInitScript(()=>{localStorage.setItem('popnwash-lang','fr');localStorage.removeItem('popnwash-theme')});
                await p.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle', timeout:45000});
                const visual=await p.evaluate(()=>({
                  theme:document.documentElement.dataset.theme,
                  source:document.documentElement.dataset.themeSource,
                  slider:document.querySelector('#themeSlider').value,
                  bodyBg:getComputedStyle(document.body).backgroundColor,
                  headerBg:getComputedStyle(document.querySelector('.site-header')).backgroundColor,
                  logoVisible:getComputedStyle(document.querySelector('.brand-logo-wrap img')).display!=='none' && document.querySelector('.brand-logo-wrap img').naturalWidth>0
                }));
                if(visual.theme!==systemScheme) failures.push(engineName+' system '+systemScheme+': first visit theme '+visual.theme);
                if(visual.source!=='system') failures.push(engineName+' system '+systemScheme+': source '+visual.source);
                if(visual.slider!==(systemScheme==='dark'?'1':'0')) failures.push(engineName+' system '+systemScheme+': slider '+visual.slider);
                if(systemScheme==='light' && visual.headerBg!=='rgb(255, 230, 188)') failures.push(engineName+' system '+systemScheme+': light header '+visual.headerBg);
                if(systemScheme==='dark' && visual.headerBg==='rgb(255, 230, 188)') failures.push(engineName+' system '+systemScheme+': dark header stayed beige');
                if(!visual.logoVisible) failures.push(engineName+' system '+systemScheme+': logo hidden');
                await p.close();
              }
              // Explicit user choices must override the system.
              for(const requestedMode of ['light','dark']){
                const p=await b.newPage({viewport:{width:1366,height:900},colorScheme:systemScheme});
                await p.addInitScript(({mode})=>{localStorage.setItem('popnwash-lang','fr');localStorage.setItem('popnwash-theme',mode)},{mode:requestedMode});
                await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});
                const visual=await p.evaluate(()=>({
                  theme:document.documentElement.dataset.theme,
                  source:document.documentElement.dataset.themeSource,
                  bodyBg:getComputedStyle(document.body).backgroundColor,
                  bodyColor:getComputedStyle(document.body).color,
                  headerBg:getComputedStyle(document.querySelector('.site-header')).backgroundColor,
                  titleColor:getComputedStyle(document.querySelector('.brand-title')).color
                }));
                if(visual.theme!==requestedMode) failures.push(engineName+' '+systemScheme+' saved '+requestedMode+': theme '+visual.theme);
                if(requestedMode==='light'){
                  if(visual.bodyBg!=='rgb(247, 240, 223)') failures.push(engineName+' light: body '+visual.bodyBg);
                  if(visual.bodyColor!=='rgb(22, 28, 27)') failures.push(engineName+' light: text '+visual.bodyColor);
                  if(visual.headerBg!=='rgb(255, 230, 188)') failures.push(engineName+' light: header '+visual.headerBg);
                  if(visual.titleColor!=='rgb(22, 28, 27)') failures.push(engineName+' light: brand '+visual.titleColor);
                }else{
                  const rgbSum=s=>{const m=s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?(+m[1]+ +m[2]+ +m[3]):999};
                  if(visual.bodyBg==='rgb(247, 240, 223)'||rgbSum(visual.bodyBg)>260) failures.push(engineName+' dark: body '+visual.bodyBg);
                  if(rgbSum(visual.bodyColor)<570) failures.push(engineName+' dark: text '+visual.bodyColor);
                  if(visual.headerBg==='rgb(255, 230, 188)'||rgbSum(visual.headerBg)>300) failures.push(engineName+' dark: header '+visual.headerBg);
                  if(rgbSum(visual.titleColor)<570) failures.push(engineName+' dark: brand '+visual.titleColor);
                }
                await p.close();
              }
            }
            await b.close();
          }

          // Dark readability regression checks from the visual review.
          {
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1000},colorScheme:'dark'});
            await p.addInitScript(()=>{localStorage.setItem('popnwash-lang','fr');localStorage.setItem('popnwash-theme','dark')});
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});
            const dark=await p.evaluate(()=>({
              wiBg:getComputedStyle(document.querySelector('.hero-wiline-card')).backgroundColor,
              wiTitle:getComputedStyle(document.querySelector('.hero-wiline-copy strong')).color,
              wiSmall:getComputedStyle(document.querySelector('.hero-wiline-copy small')).color,
              heroTrustBg:getComputedStyle(document.querySelector('.hero-trust span:nth-child(2)')).backgroundColor,
              heroTrustColor:getComputedStyle(document.querySelector('.hero-trust span:nth-child(2)')).color,
              contactBg:getComputedStyle(document.querySelector('.contact-section')).backgroundColor,
              contactInfoBg:getComputedStyle(document.querySelector('.contact-info-copy')).backgroundColor,
              contactH2:getComputedStyle(document.querySelector('.contact-info-copy h2')).color,
              formBg:getComputedStyle(document.querySelector('.contact-form-card')).backgroundColor,
              inputBg:getComputedStyle(document.querySelector('.contact-form-card input')).backgroundColor,
              inputColor:getComputedStyle(document.querySelector('.contact-form-card input')).color,
              logoDisplay:getComputedStyle(document.querySelector('.brand-logo-wrap img')).display,
              logoOpacity:getComputedStyle(document.querySelector('.brand-logo-wrap img')).opacity
            }));
            const rgbSum=s=>{const m=s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?(+m[1]+ +m[2]+ +m[3]):999};
            if(rgbSum(dark.wiTitle)<570) failures.push('dark readability: WiLine title '+dark.wiTitle);
            if(rgbSum(dark.wiSmall)<500) failures.push('dark readability: WiLine secondary '+dark.wiSmall);
            if(dark.heroTrustBg==='rgb(255, 255, 255)'||rgbSum(dark.heroTrustBg)>420) failures.push('dark readability: hero trust surface '+dark.heroTrustBg);
            if(rgbSum(dark.heroTrustColor)<560) failures.push('dark readability: hero trust text '+dark.heroTrustColor);
            if(rgbSum(dark.contactBg)>360) failures.push('dark readability: contact bg '+dark.contactBg);
            if(rgbSum(dark.contactInfoBg)>420) failures.push('dark readability: contact info bg '+dark.contactInfoBg);
            if(rgbSum(dark.contactH2)<570) failures.push('dark readability: contact h2 '+dark.contactH2);
            if(rgbSum(dark.formBg)>420) failures.push('dark readability: form bg '+dark.formBg);
            if(rgbSum(dark.inputBg)>220||rgbSum(dark.inputColor)<560) failures.push('dark readability: input contrast '+JSON.stringify(dark));
            if(dark.logoDisplay==='none'||dark.logoOpacity==='0') failures.push('header logo hidden');
            await b.close();
          }

          // Interaction and nature regression checks.
          {
            const b=await chromium.launch({headless:true});
            for(const mode of ['light','dark']){
              const p=await b.newPage({viewport:{width:1440,height:1000},colorScheme:mode});
              await p.addInitScript(({mode})=>{localStorage.setItem('popnwash-lang','fr');localStorage.setItem('popnwash-theme',mode)},{mode});
              await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});
              const missingTransitions=await p.evaluate(()=>{
                const els=[...document.querySelectorAll('a[href],button,summary')].filter(el=>{
                  const r=el.getBoundingClientRect();const cs=getComputedStyle(el);
                  return r.width>0&&r.height>0&&cs.display!=='none'&&cs.visibility!=='hidden';
                });
                return els.filter(el=>getComputedStyle(el).transitionDuration.split(',').every(v=>parseFloat(v)===0)).map(el=>el.outerHTML.slice(0,120));
              });
              if(missingTransitions.length) failures.push(mode+': interactive elements without transition '+missingTransitions.slice(0,5).join(' | '));
              const nature=await p.evaluate(()=>({
                brandBefore:getComputedStyle(document.querySelector('.brand-lockup'),'::before').content,
                kickerAfter:getComputedStyle(document.querySelector('.section-kicker'),'::after').content
              }));
              if(nature.kickerAfter==='none'||nature.kickerAfter==='normal') failures.push(mode+': section nature accent missing');

              const fb=p.locator('.social-link.facebook');
              const ig=p.locator('.social-link.instagram');
              const fbBefore=await fb.evaluate(el=>getComputedStyle(el).backgroundImage+'|'+getComputedStyle(el).backgroundColor);
              await fb.hover();await p.waitForTimeout(320);
              const fbAfter=await fb.evaluate(el=>getComputedStyle(el).backgroundImage+'|'+getComputedStyle(el).backgroundColor);
              if(fbBefore===fbAfter) failures.push(mode+': Facebook hover not visually changing');
              const igBefore=await ig.evaluate(el=>getComputedStyle(el).backgroundImage+'|'+getComputedStyle(el).backgroundColor+'|'+getComputedStyle(el).boxShadow+'|'+getComputedStyle(el).transform);
              await ig.hover();await p.waitForTimeout(320);
              const igAfter=await ig.evaluate(el=>getComputedStyle(el).backgroundImage+'|'+getComputedStyle(el).backgroundColor+'|'+getComputedStyle(el).boxShadow+'|'+getComputedStyle(el).transform);
              if(igBefore===igAfter) failures.push(mode+': Instagram hover not visually changing');

              const wi=p.locator('.hero-wiline-card').first();
              const wiBefore=await wi.evaluate(el=>getComputedStyle(el).transform+'|'+getComputedStyle(el).boxShadow);
              await wi.hover();await p.waitForTimeout(320);
              const wiAfter=await wi.evaluate(el=>getComputedStyle(el).transform+'|'+getComputedStyle(el).boxShadow);
              if(wiBefore===wiAfter) failures.push(mode+': WiLine hover not visually changing');
              await p.close();
            }
            await b.close();
          }

          // Final visual regression checks: logo, dark contrast, and obvious hover states.
          {
            const b=await chromium.launch({headless:true});
            for(const mode of ['light','dark']){
              const p=await b.newPage({viewport:{width:1440,height:1000},colorScheme:mode});
              await p.addInitScript(({mode})=>{localStorage.setItem('popnwash-lang','fr');localStorage.setItem('popnwash-theme',mode)},{mode});
              await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});
              const base=await p.evaluate(()=>({
                logoComplete:document.querySelector('.brand-logo-wrap img').complete,
                logoW:document.querySelector('.brand-logo-wrap img').naturalWidth,
                logoRect:document.querySelector('.brand-logo-wrap img').getBoundingClientRect().width,
                brandTitle:getComputedStyle(document.querySelector('.brand-title')).color,
                heroSub:getComputedStyle(document.querySelector('.hero-sub')).color,
                wiTitle:getComputedStyle(document.querySelector('.hero-wiline-copy strong')).color,
                wiSmall:getComputedStyle(document.querySelector('.hero-wiline-copy small')).color,
                contactH2:getComputedStyle(document.querySelector('.contact-info-copy h2')).color,
                formH3:getComputedStyle(document.querySelector('.contact-form-card h3')).color,
                inputColor:getComputedStyle(document.querySelector('.contact-form-card input')).color,
                inputBg:getComputedStyle(document.querySelector('.contact-form-card input')).backgroundColor
              }));
              if(!base.logoComplete||base.logoW<50||base.logoRect<35) failures.push(mode+': header logo not visible '+JSON.stringify(base));
              const rgbSum=s=>{const m=s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?(+m[1]+ +m[2]+ +m[3]):999};
              if(mode==='light' && base.brandTitle!=='rgb(22, 28, 27)') failures.push('light: brand title contrast '+base.brandTitle);
              if(mode==='dark'){
                if(rgbSum(base.brandTitle)<570) failures.push('dark: brand title '+base.brandTitle);
                if(rgbSum(base.heroSub)<500) failures.push('dark: hero subtitle '+base.heroSub);
                if(rgbSum(base.wiTitle)<570) failures.push('dark: WiLine title '+base.wiTitle);
                if(rgbSum(base.wiSmall)<500) failures.push('dark: WiLine secondary '+base.wiSmall);
                if(rgbSum(base.contactH2)<570) failures.push('dark: contact heading '+base.contactH2);
                if(rgbSum(base.formH3)<570) failures.push('dark: form heading '+base.formH3);
                if(rgbSum(base.inputColor)<560||rgbSum(base.inputBg)>220) failures.push('dark: form input '+JSON.stringify(base));
              }
              for(const sel of ['.desktop-nav a','.hero-wiline-card','.parking-card','.social-link.facebook','.social-link.instagram']){
                const el=p.locator(sel).first();
                if(await el.count()){
                  const before=await el.evaluate(e=>getComputedStyle(e).backgroundColor+'|'+getComputedStyle(e).backgroundImage+'|'+getComputedStyle(e).boxShadow+'|'+getComputedStyle(e).transform);
                  await el.hover();await p.waitForTimeout(340);
                  const after=await el.evaluate(e=>getComputedStyle(e).backgroundColor+'|'+getComputedStyle(e).backgroundImage+'|'+getComputedStyle(e).boxShadow+'|'+getComputedStyle(e).transform);
                  if(before===after) failures.push(mode+': hover not visible '+sel);
                }
              }
              await p.close();
            }
            await b.close();
          }

          // No pale card regression in dark mode: cards must stay on dark surfaces.
          {
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1000},colorScheme:'dark'});
            await p.addInitScript(()=>{localStorage.setItem('popnwash-lang','fr');localStorage.setItem('popnwash-theme','dark')});
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});
            const pale=await p.evaluate(()=>{
              function rgb(s){const m=s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?[+m[1],+m[2],+m[3]]:null}
              const sels=['.tariff-card','.pet-feature','.feature-split','.feature-list>div','.service-feature','.loyalty-card','.products-card','.pro-card','.pro-contact','.utility-row>div','.parking-hero','.parking-card','.review-card','.faq-group','.faq-item','.contact-info-copy','.contact-form-card'];
              const bad=[];
              for(const sel of sels){
                const el=document.querySelector(sel);if(!el)continue;
                const c=rgb(getComputedStyle(el).backgroundColor);
                if(c && (c[0]+c[1]+c[2])>560) bad.push(sel+' '+c.join(','));
              }
              return bad;
            });
            if(pale.length) failures.push('dark pale cards: '+pale.join(' | '));
            await p.close();await b.close();
          }

          // Contrast ratio audit for dark mode: test representative text throughout the whole site.
          {
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1000},colorScheme:'dark'});
            await p.addInitScript(()=>{localStorage.setItem('popnwash-lang','fr');localStorage.setItem('popnwash-theme','dark')});
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});
            const contrastFailures=await p.evaluate(()=>{
              function rgb(s){const m=s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?[+m[1],+m[2],+m[3]]:null}
              function lum(c){return c.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
              function ratio(a,b){a=lum(a);b=lum(b);return (Math.max(a,b)+.05)/(Math.min(a,b)+.05)}
              function effectiveBg(el){
                let n=el;
                while(n&&n!==document.documentElement){
                  const c=getComputedStyle(n).backgroundColor;
                  const m=c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
                  if(m&&(+m[4]||1)>.85)return [+m[1],+m[2],+m[3]];
                  n=n.parentElement;
                }
                return [14,24,21];
              }
              const selectors=['.hero-sub','.hero-wiline-copy strong','.hero-wiline-copy small','.tariff-copy strong','.tariff-copy small','.tariff-price span','.pet-copy h3','.pet-copy p','.pet-pills span','.feature-copy h2','.feature-copy>p','.feature-list strong','.feature-list small','.machine-card h3','.machine-card small','.loyalty-copy h3','.loyalty-copy p','.products-card h3','.products-card p','.pro-card strong','.pro-card p','.parking-hero h2','.parking-hero p','.parking-card strong','.parking-card small','.review-card blockquote','.review-card footer strong','.review-card footer small','.faq-item summary span','.faq-answer p','.contact-info-copy h2','.contact-info-copy p','.contact-form-card h3','.contact-form-card label>span','.footer'];
              const out=[];
              for(const sel of selectors){
                const el=document.querySelector(sel);if(!el)continue;
                const fg=rgb(getComputedStyle(el).color), bg=effectiveBg(el); if(!fg)continue;
                const r=ratio(fg,bg);
                if(r<4.3)out.push(sel+' ratio='+r.toFixed(2)+' fg='+fg.join(',')+' bg='+bg.join(','));
              }
              return out;
            });
            if(contrastFailures.length) failures.push('dark contrast: '+contrastFailures.join(' | '));
            await p.screenshot({path:'qa-screenshots/dark-desktop.png',fullPage:true});
            const nav=p.locator('.desktop-nav a').first();await nav.hover();await p.waitForTimeout(350);
            await p.screenshot({path:'qa-screenshots/dark-hover-header.png',fullPage:false});
            const social=p.locator('.social-link.instagram');await social.hover();await p.waitForTimeout(350);
            await p.screenshot({path:'qa-screenshots/dark-hover-instagram.png',fullPage:false});
            await p.close();await b.close();
          }

          if(failures.length){
            console.error('QA FAIL\n'+failures.join('\n'));
            process.exit(1);
          }
          console.log('QA PASS: 12 viewports + light/dark responsive passes + no-crop image checks + all 11 languages verified, including FAQ, form, anchors, WiLine and translated links.');
          EOF
          node qa.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa-screenshots
          path: qa-screenshots
          retention-days: 7
