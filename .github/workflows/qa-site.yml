name: QA responsive POP'n WASH

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Serve site
        run: |
          python3 -m http.server 4173 >/tmp/popnwash-http.log 2>&1 &
          echo $! > /tmp/popnwash-http.pid
          sleep 2

      - name: Run full responsive QA
        run: |
          mkdir -p qa-screenshots
          cat > qa.mjs <<'EOF'
          import { chromium, firefox, webkit } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const cases = [
            ['phone-portrait-360',360,800],
            ['phone-portrait-390',390,844],
            ['phone-landscape',844,390],
            ['tablet-portrait',768,1024],
            ['tablet-landscape',1024,768],
            ['laptop',1366,768],
            ['desktop',1920,1080],
          ];
          const failures=[];
          for (const [name,width,height] of cases) {
            const page = await browser.newPage({viewport:{width,height}});
            await page.addInitScript(() => localStorage.setItem('popnwash-lang','fr'));
            const consoleErrors=[];
            page.on('pageerror', e => consoleErrors.push('pageerror: '+e.message));
            page.on('console', m => { if(m.type()==='error') consoleErrors.push('console: '+m.text()); });
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle', timeout:45000});
            await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
            await page.waitForTimeout(300);
            await page.evaluate(() => window.scrollTo(0,0));
            const overflow = await page.evaluate(() => ({
              sw: document.documentElement.scrollWidth,
              cw: document.documentElement.clientWidth
            }));
            if (overflow.sw > overflow.cw + 2) failures.push(`${name}: horizontal overflow ${overflow.sw}>${overflow.cw}`);
            const weebly = await page.locator('img[src*="weebly.com"]').count();
            if(weebly) failures.push(`${name}: Weebly dependency still present`);
            const localBroken = await page.locator('img').evaluateAll(async imgs => {
              for (const img of imgs) {
                img.loading='eager';
                img.scrollIntoView({block:'center'});
                if (!img.complete) await new Promise(resolve => {
                  const done=()=>resolve();
                  img.addEventListener('load',done,{once:true});
                  img.addEventListener('error',done,{once:true});
                  setTimeout(done,2500);
                });
              }
              return imgs.filter(i => !i.complete || i.naturalWidth===0).map(i => i.getAttribute('src'));
            });
            if(localBroken.length) failures.push(`${name}: broken images ${localBroken.join(', ')}`);
            const checks = {
              h1: await page.locator('h1').count(),
              lang: await page.locator('#langButton').count(),
              wi: await page.locator('a[href*="status.wi-line.fr"]').count(),
              phone: await page.locator('a[href="tel:+32486999251"]').count(),
              mail: await page.locator('a[href="mailto:ahb.lavoir@gmail.com"]').count(),
              facebook: await page.locator('a[href*="facebook.com/people/POPn-Wash-Wavre"]').count(),
              instagram: await page.locator('a[href*="instagram.com/popnwashwavre"]').count(),
              services: await page.locator('#services').count(),
              pros: await page.locator('#pros').count(),
              themeSlider: await page.locator('#themeSlider').count(),
              pet7: await page.getByText('7 kg · 4,00 €', {exact:true}).count(),
              pet14: await page.getByText('14 kg · 7,00 €', {exact:true}).count(),
            };
            for(const [k,v] of Object.entries(checks)) if(!v) failures.push(`${name}: missing ${k}`);
            const pageText = await page.locator('body').textContent();
            for (const product of ['Lessive Éco','Lessive Peaux sensibles','Lessive Premium','Assouplissant parfumé','Assouplissant peaux sensibles','Désinfectant','Détachant oxygéné']) {
              if(!pageText.includes(product)) failures.push(`${name}: missing product ${product}`);
            }
            if(!pageText.includes('code valable 24 h') && !pageText.includes('valable 24 h')) failures.push(`${name}: invoice 24h instructions incomplete`);
            const internal = await page.locator('a[href^="#"]').evaluateAll(as => as.map(a=>a.getAttribute('href')));
            for (const href of internal) {
              if(href !== '#' && !(await page.locator(href).count())) failures.push(`${name}: broken anchor ${href}`);
            }
            await page.locator('#langButton').click();
            const langs = await page.locator('#langMenu button[data-lang]').count();
            if(langs !== 11) failures.push(`${name}: expected 11 languages, got ${langs}`);
            await page.locator('#langMenu button[data-lang="ro"]').click();
            if((await page.locator('#langCode').textContent()) !== 'RO') failures.push(`${name}: Romanian switch failed`);
            if(consoleErrors.length) failures.push(`${name}: JS/console errors: ${consoleErrors.join(' | ')}`);
            await page.screenshot({path:`qa-screenshots/${name}.png`, fullPage:true});
            await page.close();
          }
          // Full language audit: every language, current hero, FAQ, form and links.
          {
            const page = await browser.newPage({viewport:{width:1366,height:900}});
            await page.addInitScript(() => localStorage.setItem('popnwash-lang','fr'));
            const consoleErrors=[];
            page.on('pageerror', e => consoleErrors.push('pageerror: '+e.message));
            page.on('console', m => { if(m.type()==='error') consoleErrors.push('console: '+m.text()); });
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle', timeout:45000});
            const languages=['fr','nl','en','de','it','es','pt','ro','pl','uk','ru'];
            const expectedCodes={fr:'FR',nl:'NL',en:'EN',de:'DE',it:'IT',es:'ES',pt:'PT',ro:'RO',pl:'PL',uk:'UA',ru:'RU'};
            const frenchHero="Plus de machines.";
            const frenchFaq="Comment lancer un lave-linge ?";
            const frenchPlaceholder="Expliquez-nous votre demande, votre idée ou ce que vous aimeriez améliorer...";
            for(const lang of languages){
              await page.locator('#langButton').click();
              await page.locator('#langMenu button[data-lang="'+lang+'"]').click();
              await page.waitForTimeout(80);
              const code=(await page.locator('#langCode').textContent())?.trim();
              if(code!==expectedCodes[lang]) failures.push('lang '+lang+': code '+code+' != '+expectedCodes[lang]);
              const hero=(await page.locator('h1').innerText()).trim();
              const faqQ=(await page.locator('[data-faq="washer"] summary span').innerText()).trim();
              const placeholder=await page.locator('[data-i18n-placeholder="messagePlaceholder"]').getAttribute('placeholder');
              const faqCount=await page.locator('[data-faq]').count();
              if(faqCount!==22) failures.push('lang '+lang+': expected 22 FAQ items, got '+faqCount);
              if(lang!=='fr' && hero.includes(frenchHero)) failures.push('lang '+lang+': hero stayed French');
              if(lang!=='fr' && faqQ===frenchFaq) failures.push('lang '+lang+': FAQ stayed French');
              if(lang!=='fr' && placeholder===frenchPlaceholder) failures.push('lang '+lang+': form placeholder stayed French');
              const subjectText=(await page.locator('#contactSubject option').first().textContent())?.trim();
              if(lang!=='fr' && subjectText==='Choisir un sujet') failures.push('lang '+lang+': subject option stayed French');
              const badFaqLinks=await page.locator('[data-faq] a').evaluateAll(as=>as.filter(a=>{
                const h=a.getAttribute('href')||'';
                return !(h==='#contact'||h.startsWith('https://status.wi-line.fr/')||h.startsWith('https://www.google.com/maps/'));
              }).map(a=>a.getAttribute('href')));
              if(badFaqLinks.length) failures.push('lang '+lang+': bad FAQ links '+badFaqLinks.join(','));
              const internal=await page.locator('a[href^="#"]').evaluateAll(as=>[...new Set(as.map(a=>a.getAttribute('href')).filter(Boolean))]);
              for(const href of internal){
                if(href!=='#' && !(await page.locator(href).count())) failures.push('lang '+lang+': broken anchor '+href);
              }
            }
            if(consoleErrors.length) failures.push('language audit JS errors: '+consoleErrors.join(' | '));
            await page.close();
          }

          await browser.close();

          // Cross-browser theme audit: same light rendering everywhere + explicit dark + automatic mode.
          for (const [engineName,engine] of [['chromium',chromium],['firefox',firefox],['webkit',webkit]]) {
            const b = await engine.launch({headless:true});
            for (const systemScheme of ['light','dark']) {
              for (const requestedMode of ['light','auto','dark']) {
                const p = await b.newPage({viewport:{width:1366,height:900},colorScheme:systemScheme});
                await p.addInitScript(({mode}) => {
                  localStorage.setItem('popnwash-lang','fr');
                  localStorage.setItem('popnwash-theme',mode);
                }, {mode:requestedMode});
                await p.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle', timeout:45000});
                const expectedResolved=requestedMode==='auto'?systemScheme:requestedMode;
                const visual = await p.evaluate(() => ({
                  theme:document.documentElement.dataset.theme,
                  mode:document.documentElement.dataset.themeMode,
                  bodyBg:getComputedStyle(document.body).backgroundColor,
                  bodyColor:getComputedStyle(document.body).color,
                  headerBg:getComputedStyle(document.querySelector('.site-header')).backgroundColor,
                  logoBg:getComputedStyle(document.querySelector('.brand-logo-wrap')).backgroundColor,
                  titleColor:getComputedStyle(document.querySelector('.brand-title')).color,
                  slider:getComputedStyle(document.querySelector('.theme-slider-shell')).backgroundColor
                }));
                if(visual.mode!==requestedMode) failures.push(engineName+' '+systemScheme+' '+requestedMode+': mode '+visual.mode);
                if(visual.theme!==expectedResolved) failures.push(engineName+' '+systemScheme+' '+requestedMode+': resolved '+visual.theme+' != '+expectedResolved);
                const expectedBody=expectedResolved==='dark'?'rgb(15, 24, 21)':'rgb(247, 240, 223)';
                const expectedText=expectedResolved==='dark'?'rgb(246, 242, 233)':'rgb(22, 28, 27)';
                if(visual.bodyBg!==expectedBody) failures.push(engineName+' '+systemScheme+' '+requestedMode+': body bg '+visual.bodyBg);
                if(visual.bodyColor!==expectedText) failures.push(engineName+' '+systemScheme+' '+requestedMode+': body text '+visual.bodyColor);
                if(visual.headerBg!=='rgb(255, 230, 188)') failures.push(engineName+' '+systemScheme+' '+requestedMode+': header bg '+visual.headerBg);
                if(visual.logoBg!=='rgb(255, 230, 188)') failures.push(engineName+' '+systemScheme+' '+requestedMode+': logo bg '+visual.logoBg);
                if(visual.titleColor!=='rgb(22, 28, 27)') failures.push(engineName+' '+systemScheme+' '+requestedMode+': brand title '+visual.titleColor);
                await p.close();
              }
            }
            await b.close();
          }

          // Dark readability regression checks from the visual review.
          {
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1000},colorScheme:'dark'});
            await p.addInitScript(()=>{localStorage.setItem('popnwash-lang','fr');localStorage.setItem('popnwash-theme','dark')});
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});
            const dark=await p.evaluate(()=>({
              wiBg:getComputedStyle(document.querySelector('.hero-wiline-card')).backgroundColor,
              wiTitle:getComputedStyle(document.querySelector('.hero-wiline-copy strong')).color,
              wiSmall:getComputedStyle(document.querySelector('.hero-wiline-copy small')).color,
              heroTrustBg:getComputedStyle(document.querySelector('.hero-trust span:nth-child(2)')).backgroundColor,
              heroTrustColor:getComputedStyle(document.querySelector('.hero-trust span:nth-child(2)')).color,
              contactBg:getComputedStyle(document.querySelector('.contact-section')).backgroundColor,
              contactInfoBg:getComputedStyle(document.querySelector('.contact-info-copy')).backgroundColor,
              contactH2:getComputedStyle(document.querySelector('.contact-info-copy h2')).color,
              formBg:getComputedStyle(document.querySelector('.contact-form-card')).backgroundColor,
              inputBg:getComputedStyle(document.querySelector('.contact-form-card input')).backgroundColor,
              inputColor:getComputedStyle(document.querySelector('.contact-form-card input')).color,
              logoDisplay:getComputedStyle(document.querySelector('.brand-logo-wrap img')).display,
              logoOpacity:getComputedStyle(document.querySelector('.brand-logo-wrap img')).opacity
            }));
            if(dark.wiTitle!=='rgb(248, 245, 238)') failures.push('dark readability: WiLine title '+dark.wiTitle);
            if(dark.wiSmall!=='rgb(201, 212, 205)') failures.push('dark readability: WiLine secondary '+dark.wiSmall);
            if(dark.heroTrustBg==='rgb(255, 255, 255)') failures.push('dark readability: hero trust stayed white');
            if(dark.heroTrustColor!=='rgb(248, 245, 238)') failures.push('dark readability: hero trust text '+dark.heroTrustColor);
            if(dark.contactBg!=='rgb(17, 29, 25)') failures.push('dark readability: contact bg '+dark.contactBg);
            if(dark.contactInfoBg!=='rgb(23, 36, 31)') failures.push('dark readability: contact info bg '+dark.contactInfoBg);
            if(dark.contactH2!=='rgb(248, 245, 238)') failures.push('dark readability: contact h2 '+dark.contactH2);
            if(dark.formBg!=='rgb(23, 36, 31)') failures.push('dark readability: form bg '+dark.formBg);
            if(dark.inputBg!=='rgb(13, 23, 20)'||dark.inputColor!=='rgb(248, 245, 238)') failures.push('dark readability: input contrast '+JSON.stringify(dark));
            if(dark.logoDisplay==='none'||dark.logoOpacity==='0') failures.push('header logo hidden');
            await b.close();
          }

          // Interaction and nature regression checks.
          {
            const b=await chromium.launch({headless:true});
            for(const mode of ['light','dark']){
              const p=await b.newPage({viewport:{width:1440,height:1000},colorScheme:mode});
              await p.addInitScript(({mode})=>{localStorage.setItem('popnwash-lang','fr');localStorage.setItem('popnwash-theme',mode)},{mode});
              await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});
              const missingTransitions=await p.evaluate(()=>{
                const els=[...document.querySelectorAll('a[href],button,summary')].filter(el=>{
                  const r=el.getBoundingClientRect();const cs=getComputedStyle(el);
                  return r.width>0&&r.height>0&&cs.display!=='none'&&cs.visibility!=='hidden';
                });
                return els.filter(el=>getComputedStyle(el).transitionDuration.split(',').every(v=>parseFloat(v)===0)).map(el=>el.outerHTML.slice(0,120));
              });
              if(missingTransitions.length) failures.push(mode+': interactive elements without transition '+missingTransitions.slice(0,5).join(' | '));
              const nature=await p.evaluate(()=>({
                brandBefore:getComputedStyle(document.querySelector('.brand-lockup'),'::before').content,
                kickerAfter:getComputedStyle(document.querySelector('.section-kicker'),'::after').content
              }));
              if(nature.brandBefore==='none'||nature.brandBefore==='normal') failures.push(mode+': brand nature accent missing');
              if(nature.kickerAfter==='none'||nature.kickerAfter==='normal') failures.push(mode+': section nature accent missing');

              const fb=p.locator('.social-link.facebook');
              const ig=p.locator('.social-link.instagram');
              const fbBefore=await fb.evaluate(el=>getComputedStyle(el).backgroundImage+'|'+getComputedStyle(el).backgroundColor);
              await fb.hover();await p.waitForTimeout(320);
              const fbAfter=await fb.evaluate(el=>getComputedStyle(el).backgroundImage+'|'+getComputedStyle(el).backgroundColor);
              if(fbBefore===fbAfter) failures.push(mode+': Facebook hover not visually changing');
              const igBefore=await ig.evaluate(el=>getComputedStyle(el).backgroundImage+'|'+getComputedStyle(el).backgroundColor);
              await ig.hover();await p.waitForTimeout(320);
              const igAfter=await ig.evaluate(el=>getComputedStyle(el).backgroundImage+'|'+getComputedStyle(el).backgroundColor);
              if(igBefore===igAfter) failures.push(mode+': Instagram hover not visually changing');

              const wi=p.locator('.hero-wiline-card').first();
              const wiBefore=await wi.evaluate(el=>getComputedStyle(el).transform+'|'+getComputedStyle(el).boxShadow);
              await wi.hover();await p.waitForTimeout(320);
              const wiAfter=await wi.evaluate(el=>getComputedStyle(el).transform+'|'+getComputedStyle(el).boxShadow);
              if(wiBefore===wiAfter) failures.push(mode+': WiLine hover not visually changing');
              await p.close();
            }
            await b.close();
          }

          if(failures.length){
            console.error('QA FAIL\n'+failures.join('\n'));
            process.exit(1);
          }
          console.log('QA PASS: 7 viewports + all 11 languages verified, including FAQ, form, anchors, WiLine and translated links.');
          EOF
          node qa.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa-screenshots
          path: qa-screenshots
          retention-days: 7
